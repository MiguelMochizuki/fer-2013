name: Deploy to Hugging Face Spaces

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }} # e.g. your-user/fer-2013
        run: |
          set -eu
          # Spaces need YAML front matter in README.md; the GitHub README has none.
          rm -rf .git
          printf -- '---\ntitle: FER-2013 Emotion API\nsdk: docker\napp_port: 7860\n---\n\n' \
            | cat - README.md > README.tmp
          mv README.tmp README.md
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_REF_NAME}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
