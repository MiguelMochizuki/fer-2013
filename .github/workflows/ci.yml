name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Fetch the YuNet model for the detector tests
        run: ONLY_YUNET=1 scripts/fetch_models.sh models serving/models.sha256
      - run: uv run pytest -q -m "not slow"

  web:
    name: Web demo tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
      - name: Fetch the models (classifier and both YuNet versions)
        run: |
          RELEASE_URL=$(sed -n 's/^ARG RELEASE_URL=//p' Dockerfile)
          ONLY_YUNET=1 scripts/fetch_models.sh models serving/models.sha256
          WEB=1 RELEASE_URL="$RELEASE_URL" scripts/fetch_models.sh models serving/models.sha256
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - name: Golden files are fresh
        run: uv run pytest tests/web -q

  # Needs the models Release (tag models-v1.1.0) and a complete serving/models.sha256.
  # Enable it by setting the repository variable DOCKER_BUILD=true. While it is
  # off, the release job is skipped too, so nothing ships without this smoke test.
  docker:
    name: Build and smoke test
    needs: test
    if: vars.DOCKER_BUILD == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: fer-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: scripts/smoke_test.sh fer-api:ci

  release:
    name: Create GitHub Release
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          generate_release_notes: true
