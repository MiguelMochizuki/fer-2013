name: Test, build and deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Fetch the YuNet model for the detector tests
        run: ONLY_YUNET=1 scripts/fetch_models.sh models serving/models.sha256
      - run: uv run pytest -q -m "not slow"

  # Needs the models Release (tag models-v1.0.0) and a complete serving/models.sha256.
  # Enable it by setting the repository variable DOCKER_BUILD=true. While it is
  # off, deploy is skipped too, so nothing ships without this smoke test.
  docker:
    name: Build and smoke test
    needs: test
    if: vars.DOCKER_BUILD == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: fer-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: scripts/smoke_test.sh fer-api:ci

  deploy:
    name: Deploy to Hugging Face Spaces
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # lets the job request an OIDC token for the Trusted Publisher
      contents: read
    env:
      HF_SPACE: ${{ vars.HF_SPACE }} # e.g. your-user/fer-2013
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      # No stored secret: the Space's Trusted Publisher (Settings > Trusted
      # Publishers: this repo + ci.yml) exchanges the job's OIDC identity for a
      # token that lasts 1 hour and can only write to this Space.
      - name: Get a short-lived Hugging Face token
        env:
          HF_OIDC_RESOURCE: spaces/${{ vars.HF_SPACE }}
        run: |
          set -eu
          token=$(uvx --from "huggingface_hub>=1.19.0" hf auth token)
          echo "::add-mask::$token"
          echo "HF_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Push the build context to the Space
        run: |
          set -eu
          # Push only the build context: HF rejects binary files (docs images,
          # test fixtures) not stored with LFS/Xet, and the Space doesn't need them.
          mkdir space
          cp -r Dockerfile .dockerignore pyproject.toml uv.lock LICENSE NOTICE src serving space/
          mkdir space/scripts && cp scripts/fetch_models.sh space/scripts/
          # Spaces need YAML front matter in README.md; the GitHub README has none.
          printf -- '---\ntitle: FER-2013 Emotion API\nsdk: docker\napp_port: 7860\n---\n\n' \
            | cat - README.md > space/README.md
          cd space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_REF_NAME}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main

  release:
    name: Create GitHub Release
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
