name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Fetch the YuNet model for the detector tests
        run: ONLY_YUNET=1 scripts/fetch_models.sh models serving/models.sha256
      - run: uv run pytest -q -m "not slow"

  # Enable after the model Release exists and serving/models.sha256 is complete:
  # set the repository variable DOCKER_BUILD=true.
  docker:
    if: vars.DOCKER_BUILD == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fer-api .
