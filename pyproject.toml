[project]
name = "fer-2013"
version = "0.2.0"
description = "End-to-end data analysis and deep learning pipeline for FER-2013"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "MiguelMochizuki", email = "miguelmochizukisilva@gmail.com" }
]
requires-python = ">=3.12"
 dependencies = [
     "kagglehub>=0.3.0",
     "torch>=2.0.0",
     "torchvision>=0.15.0",
     "numpy>=1.24.0",
     "pandas>=2.0.0",
     "matplotlib>=3.7.0",
     "seaborn>=0.12.0",
     "python-dotenv>=1.0.0",
     "scikit-learn>=1.5.0",
     "pydantic>=2.7.0",
     "pyyaml>=6.0.0",
     "tensorboard>=2.17.0",
     "grad-cam>=1.5.0",
 ]

[project.scripts]
# fer-2013 = "fer_2013:main"

# ==============================
# Dev dependencies
# ==============================
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
    "mypy>=1.13.0",
    "pandas-stubs>=2.2.0",
    "pre-commit>=4.0.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.29.0",
    "types-PyYAML>=6.0.12",
    {include-group = "serve"},
    {include-group = "export"},
    {include-group = "reference"},
]

# Runtime deps of the API image (no torch).
serve = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "onnxruntime>=1.18.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.9",
]

# Only needed locally to export the ONNX classifier.
export = [
    "onnx>=1.16.0",
]
# OpenCV is only the independent reference in tests and the golden generator; the image has none.
reference = [
    "opencv-python-headless>=4.9.0",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

# ==============================
# Ruff
# ==============================
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["notebooks/"]
exclude = [
    ".venv",
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "E501"
]

fixable = ["ALL"]

# ==============================
# MyPy
# ==============================
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = [
    "kagglehub.*",
    "torchvision.*",
    "seaborn.*",
    "sklearn.*",
    "pytorch_grad_cam.*",
    "onnxruntime.*",
    "onnx.*",
    "cv2.*",
]
ignore_missing_imports = true

# ==============================
# Pytest
# ==============================
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs checkpoints/best.pt"]
