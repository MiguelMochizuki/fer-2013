[project]
name = "fer-2013"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MiguelMochizuki", email = "miguelmochizukisilva@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=0.3.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
# fer-2013 = "fer_2013:main"

# ==============================
# Dev dependencies
# ==============================
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
    "mypy>=1.13.0",
    "pandas-stubs>=2.2.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

# ==============================
# Ruff
# ==============================
[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".venv",
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "E501"
]

fixable = ["ALL"]

# ==============================
# MyPy
# ==============================
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = [
    "kagglehub.*",
    "torchvision.*",
    "seaborn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ==============================
# Pytest
# ==============================
[tool.pytest.ini_options]
testpaths = ["tests"]
