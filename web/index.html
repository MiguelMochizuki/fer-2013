<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self'; worker-src 'self'">
  <title>Facial expression classifier</title>
  <meta name="description" content="A ResNet18 that reads seven facial expressions, shows where it looked, and runs entirely in your browser.">
  <meta name="theme-color" content="#eceff2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1015" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23eceff2'/%3E%3Crect x='7' y='9' width='18' height='18' fill='none' stroke='%231f3fff' stroke-width='3'/%3E%3Crect x='4' y='3' width='9' height='8' fill='%231f3fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/prototype.css">
  <script type="module" src="src/app.js"></script>
  <script type="module" src="src/prototype.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" data-s="brand"></a>
    <nav class="links" data-s-label="navLabel">
      <a class="link" href="https://github.com/MiguelMochizuki/fer-2013" rel="noopener"><span class="icon icon-github" aria-hidden="true"></span><span data-s="navCode"></span></a>
      <a class="link" href="https://github.com/MiguelMochizuki/fer-2013#api" rel="noopener"><span data-s="navApi"></span></a>
    </nav>
  </header>

  <main id="app" data-state="idle">
    <section class="intro" id="drop">
      <h1 data-s="title"></h1>
      <p class="lede" data-s="lede"></p>
      <div class="actions">
        <button class="btn btn-primary" id="choose" type="button" data-s="choosePhoto"></button>
        <button class="btn" id="camera" type="button" aria-pressed="false" data-s="useCamera"></button>
        <button class="btn btn-quiet" id="example" type="button" data-s="tryExample"></button>
      </div>
      <p class="hint"><span data-s="dropHint"></span> <span data-s="formats"></span></p>
      <p class="hint" data-s="privacy"></p>
    </section>

    <section class="stage" data-s-label="stageAria">
      <button class="plate" id="plate" type="button" data-s-label="plateAria">
        <img src="examples/astronaut.jpg" alt="" width="551" height="552">
        <span class="plate-box" aria-hidden="true"></span>
        <span class="plate-cap" data-s="plateCaption"></span>
      </button>

      <div class="photo" id="photo" hidden>
        <canvas id="canvas" role="img"></canvas>
        <div class="boxes" id="boxes"></div>
      </div>

      <div class="progress" id="progress" hidden>
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="error" id="error" role="alert" hidden>
        <span class="icon icon-warning" aria-hidden="true"></span>
        <p id="errorText"></p>
        <button class="btn" id="retry" type="button" data-s="retry" hidden></button>
      </div>
    </section>

    <section class="results" data-s-label="resultsAria">
      <div class="ghost" aria-hidden="true">
        <div class="ghost-word"></div>
        <div class="ghost-views"><div></div><div></div></div>
      </div>
      <div class="strip" id="strip" role="group" data-s-label="stripAria" hidden></div>
      <ol class="faces" id="faces"></ol>
      <dl class="timings" id="timings" hidden></dl>
    </section>

    <p class="note"><span data-s="limitation"></span> <a href="https://github.com/MiguelMochizuki/fer-2013#limitations-and-privacy" rel="noopener" data-s="limitationLink"></a></p>
  </main>

  <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
</body>
</html>
