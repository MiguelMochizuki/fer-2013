# The v1.2 recipe: original FER-2013 labels, weighted sampler and loss, early stopping on
# macro-F1. Kept for comparison; v1.2 itself was trained before seeding was fixed, so
# this config does not reproduce it exactly.

data:
  processed_dir: data/processed
  batch_size: 64
  num_workers: 4
  balanced_sampler: true

model:
  num_classes: 7
  pretrained: true

training:
  epochs: 30
  lr: 1.0e-4
  weight_decay: 1.0e-4
  early_stopping_patience: 5
  early_stopping_metric: macro_f1
  early_stopping_mode: max
  seed: 42
  class_weights: true

checkpoint:
  save_best: true
  save_last: true

tensorboard:
  enabled: true
  log_dir: runs
  run_name: fer2013
